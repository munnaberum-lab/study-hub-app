name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Release banane ke liye write permission zaroori hai
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android platform folder banao (repo mein nahi hota)
        run: |
          cp -r lib /tmp/lib_bak && cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --platforms=android --org com.studyhub --project-name study_hub .
          rm -rf lib && cp -r /tmp/lib_bak lib && cp /tmp/pubspec_bak.yaml pubspec.yaml
      - name: Internet permission + app naam
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Study Hub"#' $M
          sed -i 's#<activity#<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n        <activity#' $M
          grep -n "INTERNET\|label" $M
      - name: App icon lagao
        run: cp -r android_icons/. android/app/src/main/res/
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink

      # pubspec.yaml ke version se APK ka naam aur release tag banao
      - name: Version nikalo aur APK rename karo
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "StudyHub-v$V.apk"

      # Artifact (Actions page se download ke liye)
      - uses: actions/upload-artifact@v4
        with:
          name: StudyHub-apk
          path: StudyHub-v${{ steps.ver.outputs.version }}.apk

      # Release (Releases page pe seedhi APK, zip ke bina)
      - name: GitHub Release banao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          name: Study Hub v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: StudyHub-v${{ steps.ver.outputs.version }}.apk
